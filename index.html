<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BimRadar — Elias Hammer</title>
  <meta name="description" content="Live map of Graz Bims, buses and trains — tracked in real time.">

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BimRadar">
  <link rel="apple-touch-icon" href="./icon-180.png?v=2">
  <link rel="icon" href="./icon-32.png?v=2" sizes="32x32">
  <link rel="shortcut icon" href="./icon-32.png?v=2">

  <!-- warm up the third-party origins while the HTML is still parsing -->
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://tiles.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://verkehrsauskunft.verbundlinie.at" crossorigin>

  <!-- self-hosted MapLibre: same origin as the page, gzipped by our nginx, no
       unpkg handshake. defer lets the UI paint before the 210 KB script lands. -->
  <link rel="stylesheet" href="./maplibre-gl.css?v=4.7.1">
  <script defer src="./maplibre-gl.js?v=4.7.1"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f12; --fg: #e8eaed; --muted: #9aa0a6; --accent: #6ea8fe;
      --line: #23262b; --card: #14171c; --ink-2: #c3c2b7; --ink-3: #898781;
      --tram: #e66767; --bus: #3987e5; --regio: #008300; --night: #9085e9; --train: #898781;
      --cable: #2bb3a3;
      --ok: #199e70;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f6f8; --fg: #1a1c1e; --muted: #5f6368; --accent: #1a6dff;
      --line: #e4e4e1; --card: #ffffff; --ink-2: #52514e; --ink-3: #898781;
      --tram: #e34948; --bus: #2a78d6; --regio: #008300; --night: #4a3aa7; --train: #898781;
      --cable: #0f9488;
      --ok: #1baf7a;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg: #f5f6f8; --fg: #1a1c1e; --muted: #5f6368; --accent: #1a6dff;
        --line: #e4e4e1; --card: #ffffff; --ink-2: #52514e; --ink-3: #898781;
        --tram: #e34948; --bus: #2a78d6; --regio: #008300; --night: #4a3aa7; --train: #898781;
        --ok: #1baf7a;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { margin: 0; color: var(--fg); background: var(--bg); overflow: hidden;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    /* own stacking context: marker depth z-indexes (thousands) stay inside the
       map layer and can never rise above the panel (z 5+) */
    #mapstage { position: fixed; inset: 0; z-index: 1; }
    #map { width: 100%; height: 100%; background: #242f3e; }
    :root[data-theme="light"] #map { background: #e9ecef; }

    :root { --glasshi: rgba(255,255,255,.07); }
    :root[data-theme="light"] { --glasshi: rgba(255,255,255,.65); }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --glasshi: rgba(255,255,255,.65); } }
    main {
      position: fixed; top: 0; left: 0; bottom: 0; width: min(340px, 100vw);
      z-index: 5; overflow-y: auto; overscroll-behavior: contain;
      background: color-mix(in srgb, var(--card) 84%, transparent);
      /* saturate makes the map colours glow through instead of greying out */
      backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border-right: 1px solid var(--line); padding: .9rem 1.05rem;
      box-shadow: inset 0 1px 0 var(--glasshi), 8px 0 40px rgba(0,0,0,.35);
      transition: transform .28s ease;
      scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--fg) 18%, transparent) transparent;
    }
    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fg) 18%, transparent); border-radius: 999px; }
    main::-webkit-scrollbar-track { background: transparent; }
    body.panel-hidden main { transform: translateX(-105%); }
    #panelshow { position: fixed; top: 14px; left: 14px; z-index: 6; display: none; }
    body.panel-hidden #panelshow { display: grid; }
    @media (max-width: 44rem) {
      /* The map fills the viewport; the panel is a sheet ANCHORED TO THE VIEWPORT
         (position: fixed, bottom: 0). Keeping it in document flow was what left a
         black gap and let the stub slide under Safari's toolbar. */
      body { overflow: hidden; }
      #mapstage { position: fixed; inset: 0; left: 0; right: 0; width: 100%; height: 100dvh; }
      main {
        position: fixed; left: 0; right: 0; bottom: 0; top: auto;
        width: 100%; max-width: 100%; margin: 0;
        max-height: 78dvh; overflow-y: auto; overscroll-behavior: contain;
        border-right: 0; border-radius: 18px 18px 0 0;
        box-shadow: 0 -12px 40px rgba(0,0,0,.38);
        padding-bottom: calc(.9rem + env(safe-area-inset-bottom, 0px));
        transition: transform .28s ease, opacity .2s ease;
      }
      /* long stop names must wrap, not stretch the layout */
      .fieldwrap input { min-width: 0; scroll-margin-top: 12px; }
      .opt, .opt .chain, #results { max-width: 100%; overflow-wrap: anywhere; }
      body.panel-hidden main { transform: translateY(110%); opacity: 0; pointer-events: none; }
    }

    header { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-bottom: .5rem; }
    h1 { font-size: 1.3rem; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
    h1 .brandrow { display: flex; align-items: center; gap: .5rem; }
    h1 small { display: block; font-size: .72rem; font-weight: 500; color: var(--muted);
      letter-spacing: 0; white-space: nowrap; margin-top: 1px; }
    .brandmark { flex: none; width: 21px; height: 21px; color: var(--fg); }
    .hright { display: flex; gap: .4rem; }
    .tbtn { width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line);
      background: color-mix(in srgb, var(--card) 72%, transparent);
      backdrop-filter: blur(12px) saturate(1.5); -webkit-backdrop-filter: blur(12px) saturate(1.5);
      box-shadow: inset 0 1px 0 var(--glasshi), 0 2px 8px rgba(0,0,0,.12);
      color: var(--fg); font-size: 1rem; cursor: pointer; display: grid; place-items: center;
      transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease; }
    .tbtn svg { width: 16px; height: 16px; display: block; }
    .tbtn:hover { border-color: var(--accent); transform: translateY(-1px);
      box-shadow: inset 0 1px 0 var(--glasshi), 0 5px 14px rgba(0,0,0,.18); }
    .tbtn:active { transform: translateY(0) scale(.96); }
    .tbtn[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      background: color-mix(in srgb, var(--accent) 16%, var(--card));
      color: var(--accent);
    }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #panelshow { width: 38px; height: 38px; box-shadow: inset 0 1px 0 var(--glasshi), 0 6px 20px rgba(0,0,0,.3); }
    .grabber { display: none; }

    .live .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); position: relative; }
    .live .pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%;
      border: 2px solid var(--ok); animation: ping 1.6s ease-out infinite; }
    @keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
    .livedot.stale .pulse, .livedot.stale .pulse::after { background: var(--tram); border-color: var(--tram); animation: none; }

    .iw .ln.sm { font-size: .78rem; padding: 0 .35rem; min-width: 1.9em; text-align: center; }

    .chiprow { display: flex; align-items: center; gap: .3rem; margin: .1rem 0 .8rem; flex-wrap: wrap; }
    .vchip {
      display: inline-flex; align-items: center; gap: .3rem;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
      background: color-mix(in srgb, var(--accent) 7%, var(--card)); color: var(--fg);
      box-shadow: inset 0 1px 0 var(--glasshi);
      font: inherit; font-size: .76rem; border-radius: 999px;
      padding: .22rem .5rem .22rem .38rem; cursor: pointer;
      transition: border-color .15s ease, background .15s ease, opacity .15s ease, transform .15s ease;
    }
    .vchip:hover { border-color: var(--accent); transform: translateY(-1px); }
    .vchip:active { transform: translateY(0) scale(.97); }
    .vchip[aria-pressed="false"] { opacity: .38; background: var(--card); border-color: var(--line); }
    @keyframes countpop { 50% { transform: scale(1.3); } }
    .vchip b { display: inline-block; }
    .vchip b.pop { animation: countpop .3s ease; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    .vchip .vic { display: inline-flex; align-items: center; width: 22px; height: 12px; }
    .vchip .vic svg { width: 22px; height: 12px; display: block; }
    .vchip b { font-variant-numeric: tabular-nums; font-weight: 650; }
    .vchip .hbadge {
      width: 13px; height: 13px; border-radius: 4px; background: #5b6472; color: #fff;
      font-size: 8px; font-weight: 800; line-height: 13px; text-align: center; font-style: normal;
    }
    .livedot { margin-left: auto; display: inline-flex; }

    .tripform { display: grid; gap: .5rem; }
    .fieldwrap { position: relative; }
    .fieldwrap input { width: 100%; font: inherit; font-size: 16px; color: var(--fg);
      background: color-mix(in srgb, var(--card) 80%, transparent);
      border: 1px solid var(--line); border-radius: 12px;
      box-shadow: inset 0 1px 0 var(--glasshi);
      padding: .58rem 4.3rem .58rem .7rem;
      transition: border-color .15s ease, box-shadow .15s ease; }
    .fieldwrap input:focus { outline: none; border-color: var(--accent);
      box-shadow: inset 0 1px 0 var(--glasshi), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    .fieldwrap input.armed { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    .pickhint { margin: -.15rem 0 0; font-size: .74rem; color: var(--accent); }
    .minis { position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      display: flex; gap: 2px; }
    .mini { width: 30px; height: 30px; border-radius: 9px; border: 0; background: transparent;
      color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0;
      display: grid; place-items: center; transition: color .15s ease, background .15s ease, transform .15s ease; }
    .mini svg { width: 15px; height: 15px; display: block; }
    .mini:hover { color: var(--accent); transform: translateY(-1px); }
    .mini:active { transform: scale(.94); }
    .mini.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
    .sugg { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 9;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      overflow: hidden; box-shadow: inset 0 1px 0 var(--glasshi), 0 10px 30px rgba(0,0,0,.3);
      max-height: 240px; overflow-y: auto; }
    .sugg { max-width: 100%; }
    .sugg div { padding: .45rem .7rem; font-size: .84rem; cursor: pointer; overflow-wrap: anywhere; }
    .sugg div:hover, .sugg div.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
    .sugg .k { color: var(--muted); font-size: .72rem; margin-right: .35rem; }
    .sugg .dist { color: var(--muted); font-size: .72rem; margin-left: .4rem; }
    .sugg .sub2 { color: var(--ink-3); font-size: .74rem; }
    .sugg .nores { color: var(--muted); font-size: .82rem; cursor: default; }
    .gorow { display: flex; gap: .4rem; }
    .clr { width: 46px; flex: none; border: 1px solid var(--line); border-radius: 12px;
      background: transparent; color: var(--muted); font-size: 1rem; cursor: pointer;
      display: grid; place-items: center; transition: border-color .15s ease, color .15s ease, transform .15s ease; }
    .clr svg { width: 15px; height: 15px; display: block; }
    .clr:hover { border-color: var(--tram); color: var(--tram); transform: translateY(-1px); }
    .clr:active { transform: scale(.96); }
    .go { flex: 1; border: 0; border-radius: 12px; padding: .6rem; cursor: pointer;
      background: linear-gradient(180deg,
        color-mix(in srgb, var(--accent) 86%, #fff) 0%,
        var(--accent) 55%,
        color-mix(in srgb, var(--accent) 84%, #000) 100%);
      color: #0b1220; font: inherit; font-weight: 700; font-size: .9rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28),
                  0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent);
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease; }
    .go:hover:not(:disabled) { transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28),
                  0 7px 20px color-mix(in srgb, var(--accent) 45%, transparent); }
    .go:active:not(:disabled) { transform: translateY(0) scale(.99); }
    .go:disabled { opacity: .5; cursor: default; }

    .opt { border: 1px solid var(--line); border-radius: 12px; padding: .6rem .7rem;
      margin-top: .6rem; cursor: pointer; transition: border-color .12s ease; }
    .opt:hover, .opt.sel { border-color: var(--accent); }
    .opt .times { display: flex; align-items: baseline; gap: .5rem; font-weight: 700; font-size: .98rem; }
    .opt .times .dur { margin-left: auto; font-weight: 600; font-size: .8rem; color: var(--muted); }
    .opt .chain { display: flex; align-items: center; gap: .25rem; flex-wrap: wrap; margin-top: .4rem; }
    .opt .badge { color: #fff; font-weight: 700; font-size: .76rem; border-radius: 6px; padding: .05rem .4rem; }
    .opt .walk { color: var(--muted); font-size: .78rem; }
    .opt .arrow { color: var(--muted); font-size: .7rem; }
    .opt .meta { color: var(--muted); font-size: .75rem; margin-top: .3rem; }
    .legs { margin-top: .5rem; border-top: 1px solid var(--line); padding-top: .45rem; display: none; }
    .opt.sel .legs { display: block; }
    .leg { display: flex; gap: .5rem; font-size: .8rem; margin-bottom: .3rem; }
    .leg .lt { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 3.1em; }
    .leg .lt.rt { color: #3fbf5f; font-weight: 650; }

    .note { color: var(--muted); font-size: .78rem; line-height: 1.5; }
    /* fixed height: this line changes text often, and the sheet is bottom-anchored */
    #livetxt { min-height: 2.4em; margin: .5rem 0 0; }
    .err { color: var(--tram); font-size: .82rem; margin-top: .6rem; }
    hr { border: 0; border-top: 1px solid var(--line); margin: .9rem 0; }
    /* MapLibre popup: paint our own surface so it reads in light and dark. The
       tip is coloured on every side because MapLibre picks the anchor at runtime. */
    .maplibregl-popup { z-index: 99999; }   /* above every marker, incl. depth-sorted ones */
    .bm-pop .maplibregl-popup-content {
      background: var(--card); color: var(--fg); font: .85rem/1.5 system-ui, sans-serif;
      border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    .bm-pop .maplibregl-popup-tip { border-top-color: var(--card); border-bottom-color: var(--card);
      border-left-color: var(--card); border-right-color: var(--card); }
    .bm-pop .maplibregl-popup-close-button { color: var(--muted); font-size: 1.1rem; padding: 0 .35rem; }
    .bm-pop .maplibregl-popup-close-button:hover { background: transparent; color: var(--fg); }
    /* DOM markers: zero-size anchor boxes whose children draw around the point */
    .veh, .stopm, .pinm { position: absolute; width: 0; height: 0; }
    .veh, .stopm { cursor: pointer; }
    .veh > * { transition: opacity .35s ease; }   /* occlusion ghosting fades, not pops */
    .veh .vlabel { position: absolute; left: 0; transform: translateX(-50%);
      color: var(--fg); font: 700 11px/1 system-ui, sans-serif; white-space: nowrap;
      text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); pointer-events: none; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    .iw { background: var(--card); color: var(--fg); }
    .iw .canon, .iw b { color: var(--fg); }
    .iw .route { color: var(--ink-2); }
    .iw .dirn, .iw .next { color: var(--muted); }
    .iw .stops { border-top-color: var(--line) !important; }
    .iw .strow { color: var(--fg); }
    .iw .tm { color: var(--muted); }
    .iw .tm.rt { color: var(--ok); }
    .iw b { display: block; font-size: 1rem; margin-bottom: .1rem; }
    .iw .ln { display: inline-block; color: #fff; font-weight: 700; border-radius: 6px;
      padding: 0 .4rem; margin-right: .35rem; }
    .iw .canon { font-weight: 650; margin-top: .1rem; }
    .iw .route { color: var(--ink-2); font-size: .85rem; margin-top: .1rem; }
    .iw .dirn, .iw .next { font-size: .82rem; }
    .iw .dchip { display: inline-block; margin-top: .35rem; font-size: .78rem; font-weight: 700;
      border-radius: 999px; padding: .05rem .5rem; }
    .iw .dchip.ok   { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .iw .dchip.warn { background: color-mix(in srgb, #d99400 20%, transparent); color: #d99400; }
    .iw .dchip.bad  { background: color-mix(in srgb, var(--tram) 18%, transparent); color: var(--tram); }
    .iw .attr { font-size: .8rem; color: var(--bus); margin-top: .3rem; }
    .iw .warnmsg { font-size: .78rem; color: #d99400;
      background: color-mix(in srgb, #d99400 12%, transparent);
      border-radius: 8px; padding: .3rem .45rem; margin-top: .3rem; }
    .iw .stops { margin-top: .45rem; border-top: 1px solid var(--line); padding-top: .35rem; }
    .iw .strow { display: flex; gap: .5rem; font-size: .82rem; }
    .iw .tm { font-variant-numeric: tabular-nums; min-width: 2.8em; }
    .iw .tm.rt { font-weight: 650; }

    /* mobile: the panel is a bottom sheet that slides DOWN, so the chevron points down.
       This must come after the base rule above — equal specificity, last one wins. */
    @media (max-width: 44rem) {
      /* a bottom sheet collapses with a grab handle, not a chevron */
      #panelhide { display: none; }
      .grabber {
        display: block; width: 100%; height: 24px; padding: 0; margin: -.45rem 0 -.1rem;
        background: transparent; border: 0; cursor: pointer; position: relative;
        -webkit-tap-highlight-color: transparent; touch-action: none;
      }
      /* only the collapsed stub needs room for the summary line */
      body.panel-peek .grabber { height: 46px; }
      .grabber::before {
        content: ""; position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
        width: 46px; height: 5px; border-radius: 999px; background: var(--line);
        transition: background .15s ease, width .15s ease;
      }
      .grabber:active::before { background: var(--muted); width: 56px; }
      .peek {
        position: absolute; left: 0; right: 0; top: 20px;
        font-size: .8rem; color: var(--muted); text-align: center;
        opacity: 0; transition: opacity .2s ease; pointer-events: none;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 1rem;
      }

      /* COLLAPSED: slide the sheet down until only the handle + summary peek out.
         The gesture then lives on our own element, never on the map's pan surface. */
      body.panel-peek main {
        transform: translateY(calc(100% - 58px - env(safe-area-inset-bottom, 0px)));
        opacity: 1; pointer-events: auto;
      }
      body.panel-peek .peek { opacity: 1; }
      /* the fully-hidden mode stays available as an escape hatch */
      body.panel-hidden main { transform: translateY(110%); opacity: 0; pointer-events: none; }
    }
  </style>
</head>
<body>
  <div id="mapstage"><div id="map"></div></div>
  <button class="tbtn" id="panelshow" title="Show panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.6 4v16"/></svg>
  </button>
  <main>
    <button class="grabber" id="grabber" title="Collapse panel" aria-label="Collapse panel">
      <span class="peek" id="peek"></span>
    </button>
    <header>
      <h1>
        <span class="brandrow">
          <svg class="brandmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <rect x="7" y="2.6" width="10" height="18.8" rx="3.4"/>
            <rect x="9.4" y="5.2" width="5.2" height="3.8" rx="1" fill="currentColor" stroke="none"/>
            <circle cx="10.1" cy="17.6" r=".95" fill="currentColor" stroke="none"/>
            <circle cx="13.9" cy="17.6" r=".95" fill="currentColor" stroke="none"/>
          </svg>BimRadar</span>
        <small>Bims &amp; Busse, live in Graz</small>
      </h1>
      <div class="hright">
        <button class="tbtn" id="btn3d" title="3D view" aria-pressed="false" style="font-size:.72rem;font-weight:700">3D</button>
        <button class="tbtn" id="themebtn" title="Light/dark"></button>
        <button class="tbtn" id="panelhide" title="Hide panel" aria-label="Hide panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
        </button>
      </div>
    </header>

    <div class="chiprow" id="chiprow" role="group" aria-label="Show on map">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M12 2.2v3M12 18.8v3M2.2 12h3M18.8 12h3"/></svg>

          <button class="mini" id="pick-to" title="Pick on the map (no typing)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.2-5.4-6.2-10.2a6.2 6.2 0 1 1 12.4 0C18.2 15.6 12 21 12 21z"/><circle cx="12" cy="10.6" r="2.1"/></svg>
          </button>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V7M8 7L5 10M8 7l3 3M16 4v13m0 0l-3-3m3 3l3-3"/></svg>

  </main>

  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    // Keyless MapLibre vector basemaps (CARTO): no API key, no per-load billing.
    // dark-matter / positron mirror the app's own dark / light theme.
    const STYLE = {
      dark:  'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json'
    };
    const GRAZ = { lat: 47.0707, lng: 15.4395 };

    // ---------- HAFAS (Verbundlinie) ----------
    const HAFAS_URL = 'https://verkehrsauskunft.verbundlinie.at/hamm/gate';
    const HAFAS_AID = 'wf7mcf9bv3nv8g5f';
    function hafas(meth, req) {
      return fetch(HAFAS_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ver: '1.59', lang: 'deu', ext: 'VAO.22',
          auth: { type: 'AID', aid: HAFAS_AID },
          client: { id: 'VAO', l: 'vs_stv', type: 'AND' },
          svcReqL: [{ meth, req }]
        })
      }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(d => {
          const res = d.svcResL && d.svcResL[0];
          if (!res || res.err && res.err !== 'OK') throw new Error((res && res.errTxt) || (res && res.err) || 'HAFAS error');
          return res.res;
        });
    }

    // prodCtx.line is "xxx" for long-distance services; the real designation is in name/nameS
    function lineName(prod) {
      const ctx = (prod && prod.prodCtx) || {};
      const l = (ctx.line || '').trim();
      if (l && l.toLowerCase() !== 'xxx') return l;
      return ((prod && (prod.nameS || prod.name)) || '?').trim();
    }
    // Classify by HAFAS's own category text first — the numeric class bitmask is
    // unreliable here (cls 32 is "Fernbus", a coach, not a train). Bitmask is fallback.
    function kindOf(prod) {
      const ctx = (prod && prod.prodCtx) || {};
      const line = lineName(prod);
      const cat = (ctx.catOutL || '').toLowerCase();
      const cls = prod && prod.cls;

      // night service outranks vehicle type — at 2am that is what matters
      if (cat.indexOf('nacht') === 0 || ctx.catOutS === 's15' || /^N\d/i.test(line)) return 'night';
      if (/stra(\u00df|ss)enbahn|tram/.test(cat)) return 'tram';
      if (/s-?bahn|regionalzug|regional.?express|railjet|intercity|eurocity|nightjet|zug|bahn/.test(cat)) return 'train';
      if (/stadtbus|citybus/.test(cat)) return 'bus';
      if (/bus|taxi|ruf|sammel/.test(cat)) return 'regio';

      if (cls === 256) return 'cable';   // funicular / cable railway — Graz's Schloßbergbahn (SBL), the Almbahn. NOT a tram.
      if (cls === 16) return 'tram';
      if (cls === 128) return 'bus';
      if (cls === 64 || cls === 32 || cls === 1024 || cls === 2048) return 'regio';
      return 'train';
    }
    const KIND_COLOR = {
      tram:  () => cssv('--tram'),  bus:   () => cssv('--bus'),
      regio: () => cssv('--regio'), night: () => cssv('--night'),
      train: () => cssv('--train'), cable: () => cssv('--cable')
    };
    const KIND_LABEL = { tram: 'Stra\u00dfenbahn', bus: 'Stadtbus', regio: 'RegioBus', night: 'Nachtlinie', train: 'Zug', cable: 'Schlo\u00dfbergbahn' };
    // The funicular has no filter chip of its own \u2014 it rides under the Bim toggle.
    const chipOf = k => k === 'cable' ? 'tram' : k;
    // Official Graz tram line colours, sampled from the Verbund Linie Liniennetzplan
    // (Stand 11. Juli 2026). These are what people actually recognise on the network map.
    const LINE_COLOR = {
      '1': '#00ade7', '3': '#61bc2e', '4': '#cfa70e', '5': '#1a4f90',
      '6': '#206342', '16': '#206342', '7': '#cf181f', '17': '#cf181f',
      '23': '#9a4fad', '11': '#00ade7', '14': '#cfa70e'
    };
    // trams wear their real line colour; everything else keeps its category colour
    function vehColor(kind, line) {
      if (kind === 'tram') {
        const l = String(line || '').trim();
        if (LINE_COLOR[l]) return LINE_COLOR[l];
        const bare = l.replace(/[^0-9]/g, '');        // E1 -> 1, 4E -> 4
        if (LINE_COLOR[bare]) return LINE_COLOR[bare];
      }
      return KIND_COLOR[kind] ? KIND_COLOR[kind]() : cssv('--train');
    }
    const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

    // ---------- state ----------
    let map = null, gLoading = false, info = null;
    // canonical line names (termini) from the official Verbund Steiermark GTFS feed
    let LINES = {};
    fetch('./lines.json').then(r => r.ok ? r.json() : {}).then(d => { LINES = d; }).catch(() => {});
    const vehicles = new Map();   // jid -> {marker, kind, line, dir, from, to, t0, dur, head}
    const LMK_OCC = [];           // landmark occluders, filled once by the 3D layer's onAdd
    const filters = { tram: true, bus: true, regio: true, night: true, train: true };
    let pollTimer = null, lastOk = 0, inFlight = false;
    const stops = new Map();          // extId -> marker
    let stopsOn = true, stopsBusy = false, lastStopKey = '';
    const STOP_MIN_ZOOM = 13;

    // ---------- MapLibre bootstrap ----------
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // A thin marker wrapper: keeps the google.maps.Marker call-sites this app uses
    // (setPosition / setIcon / setMap / getMap / getPosition / addListener) while
    // MapLibre draws a plain DOM element anchored (0,0) at the coordinate.
    class Mk {
      constructor(o) {
        const el = o.element;
        this.el = el;
        if (o.title) el.title = o.title;
        if (o.zIndex != null) el.style.zIndex = o.zIndex;
        this._zb = o.zIndex || 0;
        this._ds = !!o.depthSort;
        this._render = o.render || null;
        if (this._render) this._render(el);
        this._pos = o.position;
        // ground: true lies the element flat on the map plane (vehicles, stop
        // badges) so the tilted 3D view reads like a drone shot; pins stay
        // upright billboards.
        const align = o.ground ? 'map' : 'viewport';
        this._mk = new maplibregl.Marker({ element: el, rotationAlignment: align, pitchAlignment: align });
        this._mk.setLngLat([this._pos.lng, this._pos.lat]);
        this._shown = false;
        if (o.map) this.setMap(o.map);
      }
      setPosition(p) {
        this._pos = p; this._mk.setLngLat([p.lng, p.lat]);
        // depth sort: in the tilted view, nearer (southern) vehicles must paint
        // over farther ones. Latitude maps straight to stacking order.
        if (this._ds) this.el.style.zIndex = this._zb + Math.round((48.5 - p.lat) * 4000);
        return this;
      }
      getPosition() { return this._pos; }
      setIcon(render) { this._render = render; if (render) render(this.el); return this; }
      setLabel() { return this; }               // label is folded into the element render
      setMap(m) {
        if (m) { if (!this._shown) { this._mk.addTo(m); this._shown = true; } }
        else if (this._shown) { this._mk.remove(); this._shown = false; }
        return this;
      }
      getMap() { return this._shown ? map : null; }
      addListener(ev, cb) {
        if (ev === 'click') this.el.addEventListener('click', e => { e.stopPropagation(); cb(e); });
        return this;
      }
    }

    // InfoWindow stand-in over maplibregl.Popup — same setContent/open/close surface.
    function makeInfo() {
      const p = new maplibregl.Popup({ closeButton: true, closeOnClick: false, maxWidth: '300px', className: 'bm-pop', offset: 16 });
      p.on('close', () => clearRoute());
      return {
        setContent(node) { p.setDOMContent(node); },
        open(o) {
          const pos = o.lngLat || (o.anchor && o.anchor.getPosition());
          if (!pos) return;
          p.setLngLat([pos.lng, pos.lat]);
          if (!p.isOpen()) p.addTo(map);
        },
        close() { if (p.isOpen()) p.remove(); }
      };
    }

    // GeoJSON line layers stand in for google.maps.Polyline (route + trip overlays)
    function setLine(id, pts, paint) {
      removeLine(id);
      map.addSource(id, { type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: pts.map(p => [p.lng, p.lat]) } } });
      map.addLayer({ id, type: 'line', source: id, layout: { 'line-cap': 'round', 'line-join': 'round' }, paint });
    }
    function removeLine(id) {
      if (map && map.getLayer(id)) map.removeLayer(id);
      if (map && map.getSource(id)) map.removeSource(id);
    }

    // ---------- 3D: tilted camera + extruded buildings ----------
    let pitched = false;
    try { pitched = localStorage.getItem('bm_3d') === '1'; } catch (e) {}
    // The Uhrturm, hand-built from three stacked extrusion tiers (shaft, wooden
    // gallery ring, roof cap) at its real OSM location — the Schlossberg has no
    // building footprints, so without it the city's landmark hill is a void.
    const UHRTURM = {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"b":0,"h":19,"c":"#ded5c4"},"geometry":{"type":"Polygon","coordinates":[[[15.4376703,47.0734991],[15.4377891,47.0734991],[15.4377891,47.0735799],[15.4376703,47.0735799],[15.4376703,47.0734991]]]}},{"type":"Feature","properties":{"b":19,"h":23.5,"c":"#7a5b43"},"geometry":{"type":"Polygon","coordinates":[[[15.4376506,47.0734856],[15.4378088,47.0734856],[15.4378088,47.0735934],[15.4376506,47.0735934],[15.4376506,47.0734856]]]}},{"type":"Feature","properties":{"b":23.5,"h":30,"c":"#a34a38"},"geometry":{"type":"Polygon","coordinates":[[[15.4376809,47.0735063],[15.4377785,47.0735063],[15.4377785,47.0735727],[15.4376809,47.0735727],[15.4376809,47.0735063]]]}}]};
    // CARTO's tiles carry real building heights; 12 m is the toy-town fallback.
    // Shared "hide the real Uhrturm + its hilltop clutter" predicate. A `within`
    // bbox fails here — footprints are clipped at a vector-tile boundary and
    // `within` returns false for clipped geometry — so we key off CARTO's
    // properties instead: `hide_3d` (CARTO's flag for the plain footprint of a
    // detailed landmark) plus the tower/Schlossberg's distinctive OSM colours.
    // Applied to both the 3D extrusion layer AND CARTO's flat `building` /
    // `building-top` fills — otherwise those flat fills draw the tower's real
    // footprint as a pale plate poking out around our hand-modeled base.
    // CARTO tiles carry the OSM id as the MapLibre feature id, so a hand-modeled
    // landmark whose CARTO footprint has no distinctive colour (e.g. the plain
    // grey Glockenturm) can be hidden precisely by id — `within` is unusable
    // here (tile-clipped geometry always returns false).
    // OSM ids whose CARTO footprints our three.js models replace. NB: CARTO
    // renders each `building:part` as its OWN feature (own id), so a multi-part
    // building (the church) needs every part listed, not just the outline.
    const LANDMARK_IDS = [
      122074496,                                                   // Glockenturm
      23786584, 1445223691, 1445223692, 1445223693,                // Murinsel: deck + café/pavilion structures
      82754770,                                                    // Herz-Jesu-Kirche outline
      189669884, 189671729, 189671731, 189671732, 189671733,       // …+ its 23 building:parts
      189671734, 189671735, 189671736, 189671737, 189671738,
      189671739, 189671740, 189671741, 189671742, 189673812,
      189673813, 189673814, 189673815, 189674865, 189674866,
      189674867, 190442413, 190442414,
      86174340, 385927810, 1445223695,                             // Kunsthaus: outline, "Friendly Alien" blob, Eisernes Haus
      38163212, 588711028, 588711029, 588711030,                   // Mausoleum: church outline + 3 dome parts
      98928218,                                                    // Rathaus
      86174338,                                                    // Mariahilferkirche
      84579393,                                                    // Grazer Dom
      84579409,                                                    // Franziskanerkirche
      29714926,                                                    // Opernhaus
      29714804,                                                    // Stadtpfarrkirche
      29714669,                                                    // Leechkirche
      163983629, 29715115, 30168156, 984935018, 84579396, 85081251, // Grazer Burg member ways + Burgtor + Paulustor block
      82226336,                                                    // Stadthalle Graz
      29983017, 29983018,                                          // TU Alte Technik member ways
      4399927, 8143951,                                            // Uni Graz Hauptgebäude member ways
      75042781,                                                    // TU Neue Technik
      1039587147, 171711442, 1039587145,                            // Anton Paar HQ + production hall (+ hall courtyard)
      81631019, 444511608,                                          // Schloss Eggenberg ring + courtyard
      27561430, 121500989, 85220561, 85220602, 85220632,            // Hauptbahnhof, Mariatrost, Landhaus + courtyards
      5130931, 183465511, 352749432,                                // Merkur Arena bowl + pitch, Science Tower
      1182262494, 235998054, 338134241, 473840147, 171711447,       // Anton Paar campus: offices, garage, halls
      27461369, 31988058, 32348394, 32649766, 1246396386,           // Neue Technik campus: Chemie, Mathe, Biochemie, Physik
      66158360, 75042778, 76042147                                  // …Wasserbau, U-courtyard wing, Chemie annex
      // NB: CARTO renders the Burg relation itself as feature id 67773 — that id is
      // PROVABLY reused for unrelated buildings in other tiles, so it must NOT be
      // hidden; the model encloses that extrusion instead (same footprint, taller).
      // Same rule for the TU (rel 67291) and Uni Hauptgebäude (rel 476): tiny
      // relation ids, never hidden — their models enclose the CARTO extrusions.
    ];
    const HIDE_TOWER = ['all',
      ['!=', ['get', 'hide_3d'], true],
      ['!=', ['get', 'colour'], '#dca96b'],                                  // Uhrturm tan shaft
      ['!', ['all', ['==', ['get', 'colour'], '#5a3d29'],                    // Uhrturm brown galleries
                    ['==', ['get', 'render_min_height'], 13]]],
      ['!=', ['get', 'colour'], '#5a81a0'],                                  // Schlossberg bastion structures / terrace slabs
      ['!', ['in', ['id'], ['literal', LANDMARK_IDS]]]                       // modeled landmarks, by OSM id
    ];
    function ensure3D() {
      if (!map) return;
      // Hide the tower's real footprint in CARTO's flat 2D fills (idempotent;
      // re-run via refresh3D on every idle, so it survives a theme setStyle).
      for (const lid of ['building', 'building-top'])
        if (map.getLayer(lid)) try { map.setFilter(lid, HIDE_TOWER); } catch (e) {}
      if (!map.getLayer('b3d')) try {
        map.addLayer({
          id: 'b3d', type: 'fill-extrusion', source: 'carto', 'source-layer': 'building',
          minzoom: 14,
          // Hide CARTO's own Uhrturm so only our hand-modeled tower shows.
          filter: HIDE_TOWER,
          layout: { visibility: pitched ? 'visible' : 'none' },
          paint: {
            'fill-extrusion-color': isDark() ? '#30343c' : '#d9d6cf',
            'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 12],
            'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
            'fill-extrusion-opacity': 0.85,
            'fill-extrusion-vertical-gradient': true
          }
        });
      } catch (e) { /* style without a building layer: 3D quietly unavailable */ }
      if (!map.getLayer('uhrturm')) try {
        if (!map.getSource('uhrturm')) map.addSource('uhrturm', { type: 'geojson', data: UHRTURM });
        map.addLayer({
          id: 'uhrturm', type: 'fill-extrusion', source: 'uhrturm',
          minzoom: 13,
          layout: { visibility: pitched ? 'visible' : 'none' },
          paint: {
            'fill-extrusion-color': ['get', 'c'],
            'fill-extrusion-height': ['get', 'h'],
            'fill-extrusion-base': ['get', 'b'],
            'fill-extrusion-opacity': 0.95,
            'fill-extrusion-vertical-gradient': true
          }
        });
      } catch (e) {}
    }
    // ---------- Stage 2: procedural three.js Uhrturm ----------
    // Lazy: three.js (267 KB gz) is imported only when 3D is first switched on.
    // The Stage-1 extrusion tower stays as the instant fallback and is hidden
    // once the modeled one is live. Built in code — no asset pipeline.
    let threeLayerFactory = null, threeLoading = false;
    async function ensureThree() {
      if (threeLayerFactory || threeLoading) return;
      threeLoading = true;
      let THREE;
      try { THREE = await import('./three.module.js?v=0.170.0'); }
      catch (e) { threeLoading = false; return; }   // stays on the blocky tower
      // Let three keep its default managed round-trip (decode sRGB->linear on
      // input, re-encode linear->sRGB on output, in-shader). Net identity, so
      // the authored hex colours render EXACTLY as written — matching how
      // MapLibre paints the surrounding CARTO buildings. (Disabling color
      // management skips the input decode but not the output encode here, which
      // darkens + red-shifts everything into "linear mud".)
      const mc = maplibregl.MercatorCoordinate.fromLngLat([15.4377297, 47.0735395], 0);
      const T = { x: mc.x, y: mc.y, z: 0, scale: mc.meterInMercatorCoordinateUnits() };
      threeLayerFactory = () => {
        let camera, scene, renderer;
        return {
          id: 'uhrturm3js', type: 'custom', renderingMode: '3d',
          onAdd(m, gl) {
            camera = new THREE.Camera();
            scene = new THREE.Scene();
            // no lights: three's lighting model changed across releases (legacy
            // lights, PI factors), so shading is BAKED into basic materials —
            // deterministic forever, and it matches the flat toy-city look.
            const mat = (c, f) => new THREE.MeshBasicMaterial({
              color: new THREE.Color(c).multiplyScalar(f) });
            // BoxGeometry face order: +x, -x, +y(top), -y, +z, -z
            const boxMats = c => [mat(c, .78), mat(c, .78), mat(c, 1.05), mat(c, .5), mat(c, 1), mat(c, .88)];
            const g = new THREE.Group();
            const add = (mesh, y) => { mesh.position.y = y; g.add(mesh); return mesh; };
            add(new THREE.Mesh(new THREE.BoxGeometry(9, 19, 9), boxMats(0xded5c4)), 9.5);      // shaft
            add(new THREE.Mesh(new THREE.BoxGeometry(13.4, 0.6, 13.4), boxMats(0x5e4634)), 19.3); // gallery floor
            add(new THREE.Mesh(new THREE.BoxGeometry(11.6, 3.4, 11.6), boxMats(0x7a5b43)), 21.3); // gallery
            const roof = add(new THREE.Mesh(new THREE.ConeGeometry(8.6, 9.5, 4), mat(0xa34a38, 1)), 27.75);
            roof.rotation.y = Math.PI / 4;               // 4-sided cone -> square hip roof
            add(new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 8), mat(0xd9b23a, 1)), 32.6); // golden tip
            // the four famous clock faces (the Uhrturm's big hand shows the HOURS)
            // decals: a SMALL polygonOffset pulls them just in front of the wall
            // they sit on — without it the disc z-fights the wall and vanishes.
            // It must stay small: at -4 the offset also beat the brown gallery
            // eave that overhangs the side clocks, so the white bled up THROUGH
            // the brown from a raised angle. -1 clears the 0.4 m wall gap but not
            // the ~1.8 m eave, so the eave now correctly occludes the clock top.
            const decal = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide,
              polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
            const face = decal(0xf5f1e2);
            const hand = decal(0x2a2620);
            for (let i = 0; i < 4; i++) {
              const a = i * Math.PI / 2;
              const f = new THREE.Group();
              f.add(new THREE.Mesh(new THREE.CircleGeometry(3.1, 24), face));
              const hr = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4.4, 0.12), hand);

          seen.add(id);
          if (stops.has(id)) continue;
          const el = document.createElement('div'); el.className = 'stopm';
          const m = new Mk({
            map, position: { lat: l.crd.y / 1e6, lng: l.crd.x / 1e6 }, ground: true,
            element: el, render: stopIcon(g.tram), title: shortStop(l.name), zIndex: 5
          });
          m.__lid = l.lid; m.__name = shortStop(l.name); m.__tram = g.tram;
          m.addListener('click', () => openStop(m));
          stops.set(id, m);
        }
        // drop stops well outside the current view to keep the map light
        for (const [id, m] of stops) {
          if (!seen.has(id) && !b.contains(m.getPosition())) { m.setMap(null); stops.delete(id); }
        }
      } catch (e) { /* stops are a bonus layer; vehicles keep working */ }
      finally { stopsBusy = false; }
    }

    async function openStop(m) {
      if (armed) {                       // a field is waiting — use this stop for it
        trip[armed] = { lid: m.__lid, name: m.__name };
        $(armed).value = m.__name;
        dropPin(armed, m.getPosition(), m.__name);
        setArmed(null);
        updateClearBtn();
        return;
      }
      const box = document.createElement('div');
      box.className = 'iw';
      const h = document.createElement('b'); h.textContent = m.__name;
      box.append(h, document.createTextNode('Loading departures…'));
      info.setContent(box); info.open({ anchor: m });
      try {
        const res = await hafas('StationBoard', { type: 'DEP', stbLoc: { lid: m.__lid }, maxJny: 8 });
        const prodL = (res.common && res.common.prodL) || [];
        const rows = document.createElement('div'); rows.className = 'stops';
        for (const j of (res.jnyL || [])) {
          const prod = prodL[j.prodX] || {};
          const st = j.stbStop || {};
          const t = hafasTime(st.dTimeR || st.dTimeS);
          const kind = kindOf(prod);
          const row = document.createElement('div'); row.className = 'strow';
          const tm = document.createElement('span');
          tm.className = 'tm' + (st.dTimeR ? ' rt' : ''); tm.textContent = t || '';
          const ln = document.createElement('span');
          ln.className = 'ln sm'; ln.style.background = vehColor(kind, lineName(prod));
          ln.textContent = lineName(prod);
          row.append(tm, ln, document.createTextNode(j.dirTxt || ''));
          rows.appendChild(row);
        }
        box.replaceChildren(h, rows.children.length ? rows : document.createTextNode('No departures right now.'));
      } catch (e) {
        box.replaceChildren(h, document.createTextNode('Departures unavailable.'));
      }
    }

    // ---------- polling ----------
    const bearing = (a, b) => {
      const φ1 = a.lat * Math.PI / 180, φ2 = b.lat * Math.PI / 180, Δλ = (b.lng - a.lng) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    };
    // Our VPS polls HAFAS once for all of Graz every ~5 s and serves the result
    // as a static file — same origin, ~50 ms, instead of ~1 s per phone direct
    // to HAFAS. Direct HAFAS stays as the fallback: used when the file is stale
    // (poller down) or the viewport leaves the cached Graz rect.
    const PROXY_URL = './api/vehicles.json';
    const PROXY_RECT = { minLon: 15.30, maxLon: 15.60, minLat: 46.98, maxLat: 47.15 };
    const PROXY_MAX_AGE = 20000;
    async function pollProxy(sw, ne) {
      const pad = 0.003;                                  // keep vehicles just off-screen
      if (sw.lng < PROXY_RECT.minLon - pad || ne.lng > PROXY_RECT.maxLon + pad ||
          sw.lat < PROXY_RECT.minLat - pad || ne.lat > PROXY_RECT.maxLat + pad) return null;
      const r = await fetch(PROXY_URL, { cache: 'no-store' });
      if (!r.ok) return null;
      const d = await r.json();
      if (!d || !d.res || Date.now() - d.t > PROXY_MAX_AGE) return null;   // stale — poller down?
      const res = d.res;
      res.jnyL = (res.jnyL || []).filter(j => j.pos &&
        j.pos.x / 1e6 >= sw.lng - pad && j.pos.x / 1e6 <= ne.lng + pad &&
        j.pos.y / 1e6 >= sw.lat - pad && j.pos.y / 1e6 <= ne.lat + pad);
      return res;
    }
    async function poll() {
      if (!map || inFlight) return;
      inFlight = true;
      try {
        const b = map.getBounds();
        if (!b) { inFlight = false; return; }
        const sw = b.getSouthWest(), ne = b.getNorthEast();
        let res = null;
        try { res = await pollProxy(sw, ne); } catch (e) { /* fall back below */ }
        if (!res) {
          res = await hafas('JourneyGeoPos', {
            maxJny: 400, onlyRT: false,
            rect: {
              llCrd: { x: Math.round(sw.lng * 1e6), y: Math.round(sw.lat * 1e6) },
              urCrd: { x: Math.round(ne.lng * 1e6), y: Math.round(ne.lat * 1e6) }
            }
          });
        }
        ingest(res);
        lastOk = Date.now();
        $('err').hidden = true;
      } catch (e) {
        showErr('Live feed hiccup (' + e.message + ') — retrying…');
      } finally {
        inFlight = false;
        updateLive();
      }
    }

    // HAFAS times are "HHMMSS" or "ddHHMMSS" (dd = day offset)
    function hafasTime(t) {
      if (!t) return null;
      const s = String(t).length === 8 ? String(t).slice(2) : String(t);
      return s.slice(0, 2) + ':' + s.slice(2, 4);
    }
    const shortStop = n => (n || '').replace(/^Graz /, '');
    // HAFAS times are [dd]HHMMSS; compare the live prognosis against the schedule
    function hafasMins(t) {
      if (!t) return null;
      const str = String(t);
      const dd = str.length === 8 ? +str.slice(0, 2) : 0;
      const b = str.length === 8 ? str.slice(2) : str;
      return dd * 1440 + (+b.slice(0, 2)) * 60 + (+b.slice(2, 4));
    }
    function delayOf(st) {
      if (!st) return null;
      const sched = hafasMins(st.dTimeS || st.aTimeS);
      const live = hafasMins(st.dTimeR || st.aTimeR);
      if (sched == null || live == null) return null;
      let d = live - sched;
      if (d > 720) d -= 1440;
      if (d < -720) d += 1440;
      return d;
    }
    function delayText(d) {
      if (d == null) return null;
      if (d <= 1 && d >= -1) return 'p\u00fcnktlich';
      return (d > 0 ? '+' : '') + d + ' min';
    }

    function ingest(res) {
      const prodL = (res.common && res.common.prodL) || [];
      const locL = (res.common && res.common.locL) || [];
      const jnyL = res.jnyL || [];
      const now = Date.now();
      const seen = new Set();
      const counts = { tram: 0, bus: 0, regio: 0, night: 0, train: 0 };

      const portions = new Set();
      for (const j of jnyL) {
        if (!j.pos) continue;
        const prod = prodL[j.prodX] || {};
        const kind = kindOf(prod);
        // The SBL "cable" line is the Schloßberglift — a vertical elevator inside
        // the rock. It travels vertically (fixed point on a flat map) and isn't
        // surface transit, so it's not shown as a moving vehicle: skip it.
        if (kind === 'cable') continue;
        // Portioned trains (EN 1277 = Warszawa + Bohumín sections coupled into
        // one consist): several journeys, one physical train, identical coords.
        // Same line at the same spot -> draw and count it once.
        if (kind === 'train') {
          const pk = lineName(prod) + '@' + Math.round(j.pos.x / 200) + ',' + Math.round(j.pos.y / 200);
          if (portions.has(pk)) continue;
          portions.add(pk);
        }
        counts[chipOf(kind)]++;
        const jid = j.jid;
        seen.add(jid);
        const to = { lat: j.pos.y / 1e6, lng: j.pos.x / 1e6 };
        const ctx = prod.prodCtx || {};
        const line = lineName(prod);
        const dir = j.dirTxt || '';
        // radar's stopL is [origin, previous, next, destination] — real names, no extra call
        const st = j.stopL || [];
        const nameAt = i => (st[i] && locL[st[i].locX]) ? shortStop(locL[st[i].locX].name) : '';
        const kindName = (ctx.catOutL || '').trim() || (prod.name || '').replace(/\s*\S+$/, '').trim();
        const nextIdx = st.length >= 3 ? st.length - 2 : -1;
        const nextStop = nextIdx >= 0 ? nameAt(nextIdx) : '';
        const nextTime = nextIdx >= 0 && st[nextIdx]
          ? hafasTime(st[nextIdx].aTimeR || st[nextIdx].aTimeS || st[nextIdx].dTimeR || st[nextIdx].dTimeS) : null;
        let delay = nextIdx >= 0 ? delayOf(st[nextIdx]) : null;
        if (delay == null) for (const x of st) { const d = delayOf(x); if (d != null) { delay = d; break; } }
        const meta = { kindName, origin: nameAt(0), dest: nameAt(st.length - 1), nextStop, nextTime, jid, delay };
        // HAFAS ships a heading with every report: dirGeo, a 32-sector compass
        // measured counterclockwise from EAST (verified against stop bearings:
        // median error 6°). Without it, a vehicle points north until its second
        // report — a few seconds of trams standing across the street.
        const feedHead = (typeof j.dirGeo === 'number')
          ? (90 - j.dirGeo * 11.25 + 360) % 360 : null;
        let v = vehicles.get(jid);
        if (!v) {
          v = { kind, line, dir, from: to, to, t0: now, dur: 0, head: feedHead ?? 0, ...meta };
          v.marker = makeMarker(v);
          v.marker.addListener('click', () => openInfo(v));
          vehicles.set(jid, v);
        } else {
          // start a glide from the current interpolated spot to the new report.
          // Heading is not set here: every frame, basePos() publishes the current
          // direction of travel as v.targetHead and animate() turns the marker
          // smoothly towards it. Standing still, the feed's heading is the target.
          const cur = basePos(v, now);
          if (cur.lat === to.lat && cur.lng === to.lng && feedHead != null) v.targetHead = feedHead;
          // the proxy ships the street geometry between the two reports (j.pth):
          // glide along it instead of the straight chord, which cuts corners
          // through building blocks. Without pth the chord is the fallback.
          v.route = buildGlidePath(cur, j.pth, to);
          v.from = cur; v.to = to; v.t0 = now; v.dur = 7000;
          v.kind = kind; v.line = line; v.dir = dir; Object.assign(v, meta);
          v.marker.setIcon(vIcon(v.kind, v.head, v.line));
        }
      }
      // remove vehicles that left the viewport / feed
      for (const [jid, v] of vehicles) {
        if (!seen.has(jid)) { v.marker.setMap(null); vehicles.delete(jid); }
      }
      deoverlap();
      for (const k of ['tram', 'bus', 'regio', 'night', 'train']) setCount('ct-' + k, counts[k]);
      applyFilter();
      updateOcclusion();
    }

    // Vehicles laying over at a terminus are often reported within a few metres of
    // each other (16, 67E and 31E sat 10 m apart at Jakominiplatz). Drawn as-is they
    // stack and only the top one is visible — so anything closer than SEP metres is
    // fanned out into a small ring. Distance-based, because a coordinate grid puts
    // near-identical points into neighbouring cells and misses exactly these cases.
    const SEP_M = 12;                     // only near-coincident vehicles
    function metresBetween(a, b) {
      const dy = (a.lat - b.lat) * 111320;
      const dx = (a.lng - b.lng) * 111320 * Math.cos(a.lat * Math.PI / 180);
      return Math.hypot(dx, dy);
    }
    function deoverlap() {
      const list = [...vehicles.values()];
      for (const v of list) v.off = null;
      const taken = new Set();
      for (let i = 0; i < list.length; i++) {
        if (taken.has(i)) continue;
        const group = [list[i]];
        taken.add(i);
        for (let j = i + 1; j < list.length; j++) {
          if (taken.has(j)) continue;
          if (metresBetween(list[i].to, list[j].to) < SEP_M) { group.push(list[j]); taken.add(j); }
        }
        if (group.length < 2) continue;
        group.sort((a, b) => String(a.line).localeCompare(String(b.line)));  // stable across polls
        // queue them along the road like vehicles waiting at a stand — each
        // offset follows its own heading, so it stays on the asphalt instead
        // of fanning sideways into the buildings
        group.forEach((v, k) => {
          const d = (k - (group.length - 1) / 2) * 14;          // metres apart
          const h = (v.head || 0) * Math.PI / 180;
          v.off = {
            lat: d * Math.cos(h) / 111320,
            lng: d * Math.sin(h) / (111320 * Math.max(0.2, Math.cos(v.to.lat * Math.PI / 180)))
          };
        });
      }
    }

    const lerp = (a, b, t) => a + (b - a) * t;
    // Pre-measure a multi-point glide path: points, cumulative lengths, and the
    // heading of each segment (so the marker can turn as it rounds the corner).
    //
    // The server's pth spans ITS previous report -> current report, but our
    // marker sits mid-glide somewhere along that stretch. Naively walking the
    // whole pth would first run BACKWARDS through vertices already passed —
    // buses visibly sprinting back and forth. So: project `from` onto the
    // shipped path and keep only what lies ahead of it.
    function buildGlidePath(from, pth, to) {
      if (!pth || !pth.length) return null;
      const raw = [...pth.map(p => ({ lat: p[0] / 1e6, lng: p[1] / 1e6 })), to];
      // nearest point on the raw path to `from` (bi = segment, bt = position on it)
      let bi = 0, bt = 0, bd = Infinity;
      for (let i = 0; i < raw.length - 1; i++) {
        const a = raw[i], b = raw[i + 1];
        const ky = 111320, kx = 111320 * Math.cos(from.lat * Math.PI / 180);
        const px = (from.lng - a.lng) * kx, py = (from.lat - a.lat) * ky;
        const bx = (b.lng - a.lng) * kx, by = (b.lat - a.lat) * ky;
        const L2 = bx * bx + by * by;
        const t = L2 ? Math.max(0, Math.min(1, (px * bx + py * by) / L2)) : 0;
        const d = Math.hypot(px - t * bx, py - t * by);
        if (d < bd) { bd = d; bi = i; bt = t; }
      }
      if (bd > 80) return null;                    // marker nowhere near this path — chord
      // keep only what lies ahead of the marker: clamped to the path START means
      // the marker still trails the whole pth (client lags the server by design)
      // — keep everything. Otherwise drop the vertices it has already passed.
      const ahead = (bi === 0 && bt === 0) ? raw : raw.slice(bi + 1);
      if (!ahead.length) return null;              // already at the end — plain lerp
      const pts = [from, ...ahead];
      const cum = [0], heads = [];
      for (let i = 1; i < pts.length; i++) {
        cum.push(cum[i - 1] + metresBetween(pts[i - 1], pts[i]));
        heads.push(bearing(pts[i - 1], pts[i]));
      }
      const total = cum[cum.length - 1];
      if (total < 1) return null;                  // degenerate — plain lerp is fine
      // a sane street path is barely longer than the chord; anything wildly
      // longer means a bad projection — glide straight rather than sprint.
      if (total > metresBetween(from, to) * 2.5 + 40) return null;
      return { pts, cum, heads, total };
    }
    // Where the vehicle really is — WITHOUT the cosmetic de-overlap offset.
    // All motion and heading math must use this; only rendering adds the offset
    // (feeding the offset back into bearings once made two coupled night-train
    // portions face each other nose-to-nose).
    function basePos(v, now) {
      let p;
      if (!v.dur) p = v.to;
      else {
        const t = Math.min(1, (now - v.t0) / v.dur);
        const r = v.route;
        if (r && t < 1) {
          // walk the street path by distance
          const d = r.total * t;
          let i = 1;
          while (i < r.cum.length - 1 && r.cum[i] < d) i++;
          const seg = (r.cum[i] - r.cum[i - 1]) || 1;
          const s = (d - r.cum[i - 1]) / seg;
          p = { lat: lerp(r.pts[i - 1].lat, r.pts[i].lat, s), lng: lerp(r.pts[i - 1].lng, r.pts[i].lng, s) };
          v.targetHead = r.heads[i - 1];          // face along the street segment
        } else {
          p = { lat: lerp(v.from.lat, v.to.lat, t), lng: lerp(v.from.lng, v.to.lng, t) };
          if (t < 1 && (v.from.lat !== v.to.lat || v.from.lng !== v.to.lng))
            v.targetHead = bearing(v.from, v.to); // face along the chord it travels
        }
      }
      return p;
    }
    function curPos(v, now) {
      const p = basePos(v, now);
      return v.off ? { lat: p.lat + v.off.lat, lng: p.lng + v.off.lng } : p;
    }
    // Retransform the existing silhouette in place (rotation + scale + label
    // offset) — no SVG rebuild, cheap enough to run every frame. Crossing the
    // detail threshold (~z16, with hysteresis so it can't flicker) does a full
    // re-render to swap between silhouette and close-up artwork.
    function updateVehTransform(v) {
      const el = v.marker.el;
      const S = vehScale();
      const isDetail = el && el.dataset.detail === '1';
      const wantDetail = isDetail ? S > 1.2 : S >= 1.3;
      if (!el || isDetail !== wantDetail) { v.marker.setIcon(vIcon(v.kind, v.head, v.line)); return; }
      const gr = el.querySelector('.gr'), gl = el.querySelector('.gl');
      if (!gr || !gl) { v.marker.setIcon(vIcon(v.kind, v.head, v.line)); return; }
      const L = vehLift(S);
      const rot = 'rotate(' + v.head.toFixed(1) + ') scale(' + S.toFixed(3) + ')';
      for (const sl of el.querySelectorAll('.sl'))
        sl.setAttribute('transform', 'translate(0,' + (-L * +sl.dataset.f).toFixed(1) + ') ' + rot);
      gr.setAttribute('transform', rot);
      gl.setAttribute('transform', 'translate(0,' + (-L).toFixed(1) + ')');
      const lb = el.querySelector('.vlabel');
      if (lb) lb.style.top = (vehHalf(v.kind, isDetail) * S + 6) + 'px';
    }
    let lastScaleZoom = -1, lastPitch = -1;
    function animate() {
      const now = Date.now();
      // while the zoom or the 3D tilt is animating, glide every marker with it
      const z = map ? map.getZoom() : -1;
      const pi = map ? map.getPitch() : 0;
      if (Math.abs(z - lastScaleZoom) > 0.01 || Math.abs(pi - lastPitch) > 0.2) {
        lastScaleZoom = z; lastPitch = pi;
        for (const v of vehicles.values()) if (v.marker.getMap()) updateVehTransform(v);
        for (const m of stops.values()) {
          const svg = m.el && m.el.firstElementChild;
          if (svg) {
            const s = stopPx(m.__tram);
            svg.setAttribute('width', s); svg.setAttribute('height', s);
            svg.style.left = (-s / 2) + 'px'; svg.style.top = (-s / 2) + 'px';
          }
        }
      }
      for (const v of vehicles.values()) {
        if (v.marker.getMap()) {
          v.marker.setPosition(curPos(v, now));
          // always face the direction of travel: chase the target heading along
          // the shortest arc, ~15%/frame — reads as a vehicle steering, not snapping
          if (v.targetHead != null) {
            const d = ((v.targetHead - v.head + 540) % 360) - 180;
            if (Math.abs(d) > 0.3) {
              v.head = (v.head + d * 0.15 + 360) % 360;
              updateVehTransform(v);
            }
          }
        }
      }
      requestAnimationFrame(animate);
    }

    function applyFilter() {
      let shown = 0;
      for (const v of vehicles.values()) {
        const on = filters[chipOf(v.kind)];
        v.marker.setMap(on ? map : null);
        if (on) shown++;
      }
      return shown;
    }

    // ---------- vehicle occlusion (3D mode) ----------
    // DOM markers always paint on top of the GL canvas, so a vehicle passing
    // behind a tall extrusion looks like it drives THROUGH the facade. True
    // per-pixel depth is impossible for DOM markers; instead, when pitched we
    // test each vehicle's line of sight and fade occluded ones to ghosts.
    // Two occluder sources: CARTO's b3d extrusions (any rendered feature that
    // covers the vehicle's ground-anchor pixel must be NEARER than the vehicle
    // — geometry behind it projects above the anchor at pitch, never onto it)
    // and our three.js landmarks (invisible to queryRenderedFeatures, so their
    // footprints are ray-tested from LMK_OCC: camera ray altitude at the
    // crossing point vs building height).
    function llLocal(L, lng, lat) {
      return [(lng - L.lng) * 111320 * Math.cos(L.lat * Math.PI / 180), (lat - L.lat) * 110540];
    }
    // smallest t along A->B where the segment enters poly (0 if A is inside)
    function segPolyMinT(A, B, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
        if (((yi > A[1]) != (yj > A[1])) && (A[0] < (xj - xi) * (A[1] - yi) / (yj - yi) + xi)) inside = !inside;
      }
      if (inside) return 0;
      const dx = B[0] - A[0], dy = B[1] - A[1];
      let best = null;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const ex = poly[j][0], ey = poly[j][1], fx = poly[i][0] - ex, fy = poly[i][1] - ey;
        const den = dx * fy - dy * fx;
        if (Math.abs(den) < 1e-9) continue;
        const t = ((ex - A[0]) * fy - (ey - A[1]) * fx) / den;
        const u = ((ex - A[0]) * dy - (ey - A[1]) * dx) / den;
        if (t > 0 && t < 1 && u >= 0 && u <= 1 && (best == null || t < best)) best = t;
      }
      return best;
    }
    // ---------- clickable landmarks ----------
    // The models are GL geometry (no DOM events), so taps are resolved
    // geometrically: a click on a tall facade corresponds to a ground point
    // further DOWN-screen (the vertical axis projects to ~sin(pitch) px/m), so
    // we walk the click point down-screen through the landmark's height and
    // point-in-polygon test each unprojected sample against the footprints.
    function ptInPoly(A, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
        if (((yi > A[1]) != (yj > A[1])) && (A[0] < (xj - xi) * (A[1] - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }
    function landmarkHit(px) {
      if (!map || !pitched || !LMK_OCC.length) return null;
      let mpp;
      try {
        mpp = 40075016.686 * Math.cos(map.getCenter().lat * Math.PI / 180) / map.transform.worldSize;
      } catch (e) { return null; }
      const vfac = Math.sin(map.getPitch() * Math.PI / 180) / mpp;   // screen px per metre of height
      for (const L of LMK_OCC) {
        const cosL = Math.cos(L.lat * Math.PI / 180);
        for (const part of L.polys) {
          const hPx = part.h * vfac;
          for (let s = 0; s <= 8; s++) {
            const g = map.unproject([px.x, px.y + hPx * s / 8]);
            const A = [(g.lng - L.lng) * 111320 * cosL, (g.lat - L.lat) * 110540];
            if (Math.abs(A[0]) > 300 || Math.abs(A[1]) > 300) break;   // far from this landmark
            if (ptInPoly(A, part.p)) return { L, part };
          }
        }
      }

    function openLandmark(L, part, lngLat) {

    function updateOcclusion() {
      if (!map) return;
      const on = pitched && map.getPitch() > 5 && map.getZoom() >= 15;
      let cam = null, camAlt = 0;
      // this MapLibre build has no getFreeCameraOptions(); derive the camera
      // from the transform: it sits cameraToCenterDistance px behind the center
      // along the reverse bearing, tilted by pitch.
      if (on) try {
        const tr = map.transform, c = map.getCenter();
        const cosLat = Math.cos(c.lat * Math.PI / 180);
        const mpp = 40075016.686 * cosLat / tr.worldSize;      // metres per screen px at center
        const dM = tr.cameraToCenterDistance * mpp;
        const pr = map.getPitch() * Math.PI / 180, az = map.getBearing() * Math.PI / 180 + Math.PI;
        camAlt = dM * Math.cos(pr);
        const horiz = dM * Math.sin(pr);
        cam = { lng: c.lng + Math.sin(az) * horiz / (111320 * cosLat),
                lat: c.lat + Math.cos(az) * horiz / 110540 };
      } catch (e) {}
      for (const v of vehicles.values()) {
        const el = v.marker.el;
        if (!el || !v.marker.getMap()) continue;
        let occ = false;
        if (cam) {
          const p = v.marker.getPosition();
          for (const L of LMK_OCC) {                    // our landmark models
            const A = llLocal(L, p.lng, p.lat);
            if (Math.abs(A[0]) > 400 || Math.abs(A[1]) > 400) continue;
            const B = llLocal(L, cam.lng, cam.lat);
            for (const part of L.polys) {
              const t = segPolyMinT(A, B, part.p);
              if (t != null && part.h > camAlt * t + 2) { occ = true; break; }
            }
            if (occ) break;
          }
          if (!occ) try {                               // CARTO extrusions
            // queryRenderedFeatures at the anchor pixel returns ANY prism whose
            // projection covers it — including tall buildings BEHIND the
            // vehicle — so it only supplies candidates; the actual front/behind
            // decision is the same ground-ray test as for landmarks: does the
            // footprint cross the vehicle→camera sight line low enough to block.
            const px = map.project([p.lng, p.lat]);
            if (px.x >= 0 && px.y >= 0 && px.x <= innerWidth && px.y <= innerHeight) {
              const Lv = { lng: p.lng, lat: p.lat };
              const B = llLocal(Lv, cam.lng, cam.lat);
              for (const f of map.queryRenderedFeatures(px, { layers: ['b3d'] })) {
                const pr = f.properties || {};
                const h = pr.render_height != null ? pr.render_height : (pr.height != null ? pr.height : 12);
                const g = f.geometry;
                const rings = g.type === 'Polygon' ? [g.coordinates[0]]
                  : g.type === 'MultiPolygon' ? g.coordinates.map(c => c[0]) : [];
                for (const ring of rings) {
                  const t = segPolyMinT([0, 0], B, ring.map(q => llLocal(Lv, q[0], q[1])));
                  if (t != null && h > camAlt * t + 2) { occ = true; break; }
                }
                if (occ) break;
              }
            }
          } catch (e) {}
        }
        // NB: not el.style.opacity — MapLibre's Marker rewrites the root
        // element's opacity on every move, silently undoing it. Children are ours.
        const o = occ ? 0.3 : '';
        for (const ch of el.children) ch.style.opacity = o;
      }
    }
    // update a counter with a tiny pop so changes catch the eye
    function setCount(id, val) {

    }
    function updateLive() {
      const fresh = Date.now() - lastOk < 20000 && lastOk > 0;
      const n = [...vehicles.values()].filter(v => filters[chipOf(v.kind)]).length;
      if (document.body.classList.contains('panel-peek')) updatePeek();
      $('live').classList.toggle('stale', !fresh);
      $('live').title = fresh ? 'live feed OK' : 'live feed interrupted';
      setCount('ct-stops', !stopsOn ? '–'
        : (map && map.getZoom() < STOP_MIN_ZOOM) ? '·' : stops.size);
      if (!fresh) {
        $('livetxt').textContent = lastOk ? 'reconnecting to the live feed…' : 'connecting…';
      } else if (n > 0) {

    // HAFAS ships routes as Google-encoded polylines (lat,lng order, 1e5 precision)
    function decodePath(str) {
      const pts = []; let i = 0, lat = 0, lng = 0;
      while (i < str.length) {
        for (let k = 0; k < 2; k++) {
          let shift = 0, res = 0, b;
          do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
          const d = (res & 1) ? ~(res >> 1) : (res >> 1);
          if (k === 0) lat += d; else lng += d;
        }
        pts.push({ lat: lat / 1e5, lng: lng / 1e5 });
      }
      return pts;
    }

    async function drawRoute(v, box, extras) {

        const res = await hafas('JourneyDetails', { jid: v.jid, getPolyline: true, getPasslist: true });
        const poly = res.common && res.common.polyL && res.common.polyL[0];
        if (poly && poly.crdEncYX) {
          clearRoute();
          setLine('route', decodePath(poly.crdEncYX),
            { 'line-color': KIND_COLOR[v.kind](), 'line-opacity': 0.75, 'line-width': 4 });
          routeLine = 'route';
        }
        if (extras) {
          const remL = (res.common && res.common.remL) || [];
          if (remL.some(r => /niederflur/i.test(r.txtN || r.txtS || '') || r.code === 'OB')) {
            const at = document.createElement('div');
            at.className = 'attr';

          for (const m of ((res.common && res.common.himL) || []).slice(0, 2)) {
            const w = document.createElement('div');
            w.className = 'warnmsg';
            const head = (m.head || '').replace(/<[^>]*>/g, '').trim();
            const txt = (m.text || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();

        }
        // remaining stops with times, straight from the live journey
        const locL = (res.common && res.common.locL) || [];

        const nowHM = new Date().toTimeString().slice(0, 5);

    // Chip glyphs are the SAME silhouettes drawn on the map, laid on their side.

    function paintChips() {
      const NS2 = 'http://www.w3.org/2000/svg';
      for (const el of document.querySelectorAll('.vic')) {
        const kind = el.dataset.kind;

          const g = document.createElementNS(NS2, 'linearGradient');
          g.setAttribute('id', 'bimgrad');
          g.setAttribute('x1', '0'); g.setAttribute('x2', '1'); g.setAttribute('y1', '0'); g.setAttribute('y2', '0');
          [['0%', LINE_COLOR['1']], ['34%', LINE_COLOR['3']], ['62%', LINE_COLOR['4']], ['100%', LINE_COLOR['7']]]
            .forEach(([o, c]) => {

              st.setAttribute('offset', o); st.setAttribute('stop-color', c);
              g.appendChild(st);
            });
          defs.appendChild(g); svg.appendChild(defs);
        }
        const path = document.createElementNS(NS2, 'path');
        path.setAttribute('d', shape);
        path.setAttribute('transform', 'rotate(90)');

    // =====================================================================

    const trip = { from: null, to: null, opts: [], sel: -1 };

    function setArmed(which) {

    // pick a point on the map: label it by the nearest stop when there is one

    const fmtDur = d => {

    function clearTripLine() { if (tripLine) { removeLine('trip'); tripLine = null; } }

    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

    // The Verbund's search covers all of Austria: "Hauptbahnhof" returns Wien and
    // Innsbruck before Graz. This app is about Graz, so results are restricted to
    // the region and ordered by distance from the city.
    const SEARCH_RADIUS_KM = 40;
    function kmFromGraz(lat, lon) {
      const dy = (lat - GRAZ.lat) * 111.32;
      const dx = (lon - GRAZ.lng) * 111.32 * Math.cos(lat * Math.PI / 180);
      return Math.hypot(dx, dy);
    }
    // Transit search alone can't find "my doctor": HAFAS has stops, addresses and a
    // few POI categories, but no Ordinationen. Photon (Komoot's OSM geocoder, free
    // and CORS-open) fills that in. Results from both are merged and ranked by
    // distance from Graz.
    const POI_LABEL = {
      doctors: 'Arzt', dentist: 'Zahnarzt', pharmacy: 'Apotheke', hospital: 'Klinik',
      clinic: 'Klinik', veterinary: 'Tierarzt', restaurant: 'Restaurant', cafe: 'Café',
      bar: 'Bar', fast_food: 'Imbiss', supermarket: 'Supermarkt', school: 'Schule',
      university: 'Uni', kindergarten: 'Kindergarten', bank: 'Bank', post_office: 'Post',
      cinema: 'Kino', theatre: 'Theater', museum: 'Museum', hotel: 'Hotel',
      sports_centre: 'Sport', swimming_pool: 'Bad', townhall: 'Amt', place_of_worship: 'Kirche'
    };
    async function searchHafas(q) {
      try {
        const res = await hafas('LocMatch', { input: { field: 'S', loc: { type: 'ALL', name: q + '?' }, maxLoc: 30 } });
        return ((res.match && res.match.locL) || []).filter(l => l.lid && l.crd).map(l => ({
          name: l.name,
          sub: '',
          kind: l.type === 'S' ? 'Stop' : l.type === 'A' ? 'Adresse' : 'POI',
          isStop: l.type === 'S',
          lid: l.lid,
          lat: l.crd.y / 1e6, lon: l.crd.x / 1e6

      } catch (e) { return []; }
    }
    async function searchPhoton(q) {
      try {
        const url = 'https://photon.komoot.io/api?q=' + encodeURIComponent(q) +
          '&lat=' + GRAZ.lat + '&lon=' + GRAZ.lng + '&limit=15&lang=de';
        const r = await fetch(url);
        if (!r.ok) return [];
        const d = await r.json();
        return (d.features || [])
          .filter(f => f.properties && f.properties.name && f.geometry)
          .filter(f => f.properties.osm_key !== 'highway')   // roads/footways aren't destinations
          .map(f => {
            const p = f.properties, c = f.geometry.coordinates;
            const bits = [p.street, p.housenumber].filter(Boolean).join(' ');
            const named = ['amenity', 'shop', 'healthcare', 'office', 'tourism', 'leisure'];
            const kind = POI_LABEL[p.osm_value]
              || (named.includes(p.osm_key) ? p.osm_value : 'Ort');
            return {
              name: p.name,
              sub: [bits, p.city || p.district].filter(Boolean).join(', '),
              kind: kind,
              isStop: false,
              lat: c[1], lon: c[0]

    }

    async function searchLoc(q, box, which) {
      if (!q || q.length < 2) { box.hidden = true; return; }
      const [a, b] = await Promise.all([searchHafas(q), searchPhoton(q)]);
      const seen = new Set();
      const near = [...a, ...b]
        .map(x => ({ ...x, d: kmFromGraz(x.lat, x.lon) }))
        .filter(x => x.d <= SEARCH_RADIUS_KM)
        .filter(x => {                                  // drop near-identical duplicates
          const key = x.name.toLowerCase().replace(/^graz /, '') + '@' +
                      x.lat.toFixed(3) + ',' + x.lon.toFixed(3);
          if (seen.has(key)) return false;
          seen.add(key); return true;
        })
        // stops get a 1.5 km head start: for a stop-name query the stop should lead
        .sort((x, y) => (x.d - (x.isStop ? 1.5 : 0)) - (y.d - (y.isStop ? 1.5 : 0)))
        .slice(0, 9);

      box.replaceChildren();
      if (!near.length) {
        const none = document.createElement('div');
        none.className = 'nores';
        none.textContent = 'Nothing found near Graz';
        box.appendChild(none);
        box.hidden = false;
        return;
      }

        const row = document.createElement('div');

        k.className = 'k';
        k.textContent = item.kind;
        row.append(k, document.createTextNode(item.name));

          sub.textContent = ' · ' + item.sub;

          e.preventDefault();

            ? { lid: item.lid, name: item.name }
            : { crd: { x: Math.round(item.lon * 1e6), y: Math.round(item.lat * 1e6) }, name: item.name };
          $(which).value = item.name;
          box.hidden = true;
          if (map) dropPin(which, { lat: item.lat, lng: item.lon }, item.name);
          updateClearBtn();
        });
        box.appendChild(row);
      }
      box.hidden = false;
    }
    const debFrom = debounce(v => searchLoc(v, $('sugg-from'), 'from'), 250);

    $('from').addEventListener('input', e => { trip.from = null; debFrom(e.target.value.trim()); updateClearBtn(); });

    function showTripErr(m) { $('triperr').textContent = m; $('triperr').hidden = false; }
    const locArg = o => o.lid ? { lid: o.lid } : { type: 'C', name: o.name, crd: o.crd };

    async function planTrip() {
      if (!trip.from || !trip.to) return showTripErr('Pick a start and a destination from the suggestions.');
