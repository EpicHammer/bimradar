name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/test.js
      - run: node --check tools/feed_poller.js && node --check tools/push_server.js && node --check tools/deploy.js && node --check tools/deploy_hook.js
